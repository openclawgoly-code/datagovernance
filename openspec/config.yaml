schema: spec-driven

context: |
  数据治理平台：Java 21 + Spring Boot 3.3 + PostgreSQL + Vue 3 + TypeScript + Element Plus。
  架构边界见 SPACE-MODEL.md / ARCHITECTURE.md；前端设计元语见 frontend/DESIGN.md；
  设计 token 在 frontend/src/styles/tokens.css；前端只消费 /api/v1，不直连 SuperSonic。
  AI 问数经 Query Gateway；StarRocks + MinIO 为当前 POC 服务层。
  前端 P0 计划见 docs/plans/2026-10-30-frontend-p0.md。

rules:
  proposal:
    - Keep proposals concise and include explicit Non-goals.
    - List affected routes/APIs and whether backend changes are required.
  tasks:
    - Group tasks by dependency order.
    - Include type-check/build verification for frontend changes.
