services:
  minio:
    image: minio/minio:latest
    container_name: dg-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "19002:9000"
      - "19003:9001"
    volumes:
      - minio_data:/data
    networks:
      - starrocks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  starrocks:
    image: starrocks/allin1-ubuntu:${STARROCKS_VERSION:-3.2.9}
    container_name: dg-starrocks
    ports:
      - "19030:9030"
      - "18030:8030"
      - "18040:8040"
    networks:
      - starrocks
    restart: unless-stopped

networks:
  starrocks:
    name: starrocks

volumes:
  minio_data:
